name: Check-MDX

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-mdx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get changed MDX files
        id: changed_mdx
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only --diff-filter=ACMRT $(git merge-base origin/main HEAD) HEAD -- '*.mdx' | paste -sd "," -)"
          else
            # For manual runs, check all tracked .mdx files
            changed="$(git ls-files '*.mdx' | paste -sd "," -)"
          fi

          echo "changed=$changed" >> $GITHUB_ENV
          echo "Changed MDX: $changed"

      - name: Install deps for MDX checker
        if: ${{ env.changed != '' }}
        run: |
          cd scripts/check-mdx
          npm install

      - name: Run MDX check (auto-fix)
        id: mdx_check
        if: ${{ env.changed != '' }}
        continue-on-error: true
        env:
          MDX_REPORT_PATH: ${{ runner.temp }}/mdx-check-report.md
        run: |
          cd scripts/check-mdx
          node check-mdx.js --fix '${{ env.changed }}'

      - name: Check MDX report exists
        id: mdx_report
        if: ${{ env.changed != '' }}
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/mdx-check-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push auto-fixes (same-repo PR only)
        id: autofix
        if: ${{ env.changed != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -e

          # If no changes, nothing to commit
          if git diff --quiet; then
            echo "did_commit=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore: auto-fix MDX issues"
          git push

          echo "did_commit=true" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Comment on PR (same-repo PR only)
        if: ${{ env.changed != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        env:
          CHECK_OUTCOME: ${{ steps.mdx_check.outcome }}
          MDX_REPORT_PATH: ${{ runner.temp }}/mdx-check-report.md
          DID_COMMIT: ${{ steps.autofix.outputs.did_commit }}
          COMMIT_SHA: ${{ steps.autofix.outputs.sha }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- mdx-check -->';
            const title = '### 🛠️ MDX check';
            const reportPath = process.env.MDX_REPORT_PATH;
            const hasReport = fs.existsSync(reportPath);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            // Nothing to report and no earlier comment to clear (or the check crashed before writing a report)
            if (!hasReport && (!existing || process.env.CHECK_OUTCOME !== 'success')) return;

            // Some TinaCMS PRs are opened by a bot: mention the assigned editor, or no one
            const pr = context.payload.pull_request;
            const login = pr.user.type === 'Bot' ? pr.assignees?.[0]?.login : pr.user.login;
            const greeting = `${title}\n\n👋 Hi${login ? ` @${login}` : ''},`;

            let body = hasReport
              ? fs.readFileSync(reportPath, 'utf8').replace(title, greeting)
              : `${marker}\n${greeting}\n\n✅ No MDX issues.\n`;

            // Mention the auto-fix commit just above the footer
            if (hasReport && process.env.DID_COMMIT === 'true' && process.env.COMMIT_SHA) {
              const note = `A commit was pushed to this PR with the fixes: ${process.env.COMMIT_SHA}`;
              const footer = body.lastIndexOf('\n_This check');
              body = footer === -1 ? `${body}\n${note}\n` : `${body.slice(0, footer)}\n${note}\n${body.slice(footer)}`;
            }

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail job if MDX check failed
        if: ${{ env.changed != '' && steps.mdx_check.outcome == 'failure' }}
        run: exit 1

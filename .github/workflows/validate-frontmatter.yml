name: Validate-Frontmatter

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - ".github/**"

  workflow_dispatch:

jobs:
  validate-frontmatter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      repository-projects: read
      pull-requests: write

    steps:
      # Step 1: Check out the source code of the pull request.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # Step 2: Set up the Node.js environment.
      - uses: actions/setup-node@v7

      # Step 3: Get the list of changed files in the PR
      - name: Get changed files
        id: get_changed
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "changed=$(git diff --name-only $(git merge-base origin/main HEAD) HEAD)" | paste -sd "," - >> $GITHUB_ENV
          echo "pr_owner=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV


      # Step 4: Check Markdown files for valid frontmatter
      - name: Lint Frontmatter
        id: check_frontmatter
        continue-on-error: true
        env:
          FRONTMATTER_REPORT_PATH: ${{ runner.temp }}/frontmatter-report.md
        run: |
          cd scripts/frontmatter-validator
          npm install --silent
          node frontmatter-validator.js '${{ env.changed }}' | tee "$RUNNER_TEMP/frontmatter-output.txt"
          exit "${PIPESTATUS[0]}"

      # Step 5: Write workflow job summary if the previous step failed
      - name: Add Job Summary
        if: ${{ steps.check_frontmatter.outcome == 'failure' }}
        run: |
          echo "Hi @$pr_owner," >> $GITHUB_STEP_SUMMARY
          cat "$RUNNER_TEMP/frontmatter-output.txt" >> $GITHUB_STEP_SUMMARY

      # Step 6: Comment on the PR (not on forks). Updates one comment in place, and changes it to ✅ once fixed
      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        env:
          CHECK_OUTCOME: ${{ steps.check_frontmatter.outcome }}
          FRONTMATTER_REPORT_PATH: ${{ runner.temp }}/frontmatter-report.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- frontmatter-check -->';
            const title = '### 🏷️ Frontmatter check';
            const reportPath = process.env.FRONTMATTER_REPORT_PATH;
            const hasReport = fs.existsSync(reportPath);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            // Nothing to report and no earlier comment to clear (or the check crashed before writing a report)
            if (!hasReport && (!existing || process.env.CHECK_OUTCOME !== 'success')) return;

            // Some TinaCMS PRs are opened by a bot: mention the assigned editor, or no one
            const pr = context.payload.pull_request;
            const login = pr.user.type === 'Bot' ? pr.assignees?.[0]?.login : pr.user.login;
            const greeting = `${title}\n\n👋 Hi${login ? ` @${login}` : ''},`;

            const body = hasReport
              ? fs.readFileSync(reportPath, 'utf8').replace(title, greeting)
              : `${marker}\n${greeting}\n\n✅ No frontmatter issues.\n`;

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail job if frontmatter check failed
        if: ${{ steps.check_frontmatter.outcome == 'failure' }}
        run: exit 1

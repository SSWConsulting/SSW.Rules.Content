name: Check-Malformed-Bold

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-malformed-bold:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get changed Markdown/MDX files
        id: changed_md
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only --diff-filter=ACMRT $(git merge-base origin/main HEAD) HEAD -- '*.md' '*.mdx' | paste -sd "," -)"
          else
            # For manual runs, check all tracked .md/.mdx files
            changed="$(git ls-files '*.md' '*.mdx' | paste -sd "," -)"
          fi

          echo "changed=$changed" >> $GITHUB_ENV
          echo "Changed Markdown/MDX: $changed"

      - name: Run malformed-bold check
        id: bold_check
        if: ${{ env.changed != '' }}
        continue-on-error: true
        env:
          BOLD_REPORT_PATH: ${{ runner.temp }}/malformed-bold-report.md
        run: |
          node scripts/check-malformed-bold/check-malformed-bold.js '${{ env.changed }}'

      - name: Check report exists
        id: bold_report
        if: ${{ env.changed != '' }}
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/malformed-bold-report.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: ${{ env.changed != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        env:
          CHECK_OUTCOME: ${{ steps.bold_check.outcome }}
          BOLD_REPORT_PATH: ${{ runner.temp }}/malformed-bold-report.md
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- malformed-bold-check -->';
            const title = '### 🅱️ Bold check';
            const reportPath = process.env.BOLD_REPORT_PATH;
            const hasReport = fs.existsSync(reportPath);

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            // Nothing to report and no earlier comment to clear (or the check crashed before writing a report)
            if (!hasReport && (!existing || process.env.CHECK_OUTCOME !== 'success')) return;

            // Some TinaCMS PRs are opened by a bot: mention the assigned editor, or no one
            const pr = context.payload.pull_request;
            const login = pr.user.type === 'Bot' ? pr.assignees?.[0]?.login : pr.user.login;
            const greeting = `${title}\n\n👋 Hi${login ? ` @${login}` : ''},`;

            let body = hasReport
              ? fs.readFileSync(reportPath, 'utf8').replace(title, greeting)
              : `${marker}\n${greeting}\n\n✅ No malformed bold formatting.\n`;

            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail job if malformed bold was found
        if: ${{ env.changed != '' && steps.bold_check.outcome == 'failure' }}
        run: exit 1

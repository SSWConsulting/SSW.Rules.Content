name: Validate-Markdown

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - '!.github/**'

  workflow_dispatch:

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      repository-projects: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Get changed files
        id: files
        uses: lots0logs/gh-action-get-changed-files@2.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Filter and format Markdown files
        run: |
          MARKDOWN_FILES=$(echo '${{ steps.files.outputs.all }}' | jq -r '.[] | select(endswith(".md"))' | tr '\n' ' ')
          echo "MARKDOWN_FILES=$MARKDOWN_FILES" >> $GITHUB_ENV

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli


      - name: Auto-fix Markdown files
        id: autofix
        if: ${{ env.MARKDOWN_FILES != '' }}
        run: |
          markdownlint --fix $MARKDOWN_FILES --config .markdownlint/config.json || true
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git commit -m "Auto-fix Markdown files"; then # Commit only if there are changes
            git push && echo "fixed=true" >> "$GITHUB_OUTPUT" || true
          fi
          echo "Auto-fix applied"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TODO: Make this work on forked branches
      - name: Lint Markdown files
        id: lint
        if: ${{ env.MARKDOWN_FILES != '' && github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        run: |
          results="$RUNNER_TEMP/lint-results.txt"
          markdownlint $MARKDOWN_FILES --config .markdownlint/config.json > "$results" 2>&1 || true
          if [[ -s "$results" ]]; then
            echo "Linting errors found"
            cat "$results"
            exit 1
          fi

      # Updates one comment in place, and changes it to ✅ once fixed
      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
        uses: actions/github-script@v9
        env:
          CHECK_OUTCOME: ${{ steps.lint.outcome }}
          AUTO_FIXED: ${{ steps.autofix.outputs.fixed }}
          LINT_RESULTS_PATH: ${{ runner.temp }}/lint-results.txt
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- markdown-check -->';
            const title = '### 📝 Markdown check';
            const rulesUrl = 'https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md';
            const results = fs.existsSync(process.env.LINT_RESULTS_PATH) ? fs.readFileSync(process.env.LINT_RESULTS_PATH, 'utf8').trim() : '';

            // Group "file:line[:col] MD009/no-trailing-spaces Description [details]" lines by file
            const byFile = new Map();
            for (const line of results.split('\n').filter(Boolean)) {
              const m = line.match(/^(.+?):(\d+)(?::\d+)?\s+(MD\d+)\/\S+\s+(.*)$/);
              const [file, text] = m
                ? [m[1], `- Line ${m[2]}: ${m[4].replace(/\s*\[Context:.*\]$/, '')} ([${m[3]}](${rulesUrl}#${m[3].toLowerCase()}))`]
                : ['Other', `- ${line}`];
              if (!byFile.has(file)) byFile.set(file, []);
              byFile.get(file).push(text);
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            const hasIssues = process.env.CHECK_OUTCOME === 'failure' && byFile.size > 0;
            const autoFixed = process.env.AUTO_FIXED === 'true';
            if (!hasIssues && !existing && !autoFixed) return;

            // Some TinaCMS PRs are opened by a bot: mention the assigned editor, or no one
            const pr = context.payload.pull_request;
            const login = pr.user.type === 'Bot' ? pr.assignees?.[0]?.login : pr.user.login;
            const parts = [marker, title, '', `👋 Hi${login ? ` @${login}` : ''},`, ''];

            if (autoFixed) parts.push('🔧 Some Markdown issues were auto-fixed and committed to this branch. Pull the latest changes before you push again.', '');
            if (hasIssues) {
              parts.push('⚠️ These issues need a manual fix:', '');
              for (const [file, lines] of byFile) parts.push(`**\`${file}\`**`, '', ...lines, '');
              parts.push('_This check blocks the PR until the issues are fixed._', '');
            } else {
              parts.push('✅ No Markdown issues.', '');
            }

            const body = parts.join('\n');
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail job if Markdown check failed
        if: ${{ steps.lint.outcome == 'failure' }}
        run: exit 1

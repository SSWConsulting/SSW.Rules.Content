<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Knowledge graph: the question follows links between entities</title>
  <desc id="desc">A Northwind example. The customer node for Alfreds Futterkiste holds a short summary - Berlin, Germany; contact Maria Anders - and links to its source documents (emails, contracts and notes) and to its contact. The question follows the highlighted path from the customer: placed Orders, which contain a discontinued Product, supplied by a Supplier, located in the Country Germany. The path and its sources go to the LLM.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CC4141"/>
    </marker>
  </defs>

  <rect data-bg="1" width="800" height="450" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="40" y="30" width="5" height="26" rx="2" fill="#CC4141"/>
  <text x="56" y="51" font-size="22" font-weight="700" fill="#333333">Knowledge graph</text>

  <!-- Question -->
  <rect x="40" y="223" width="130" height="60" rx="12" fill="#FFFFFF" stroke="#CC4141" stroke-width="2"/>
  <circle cx="62" cy="253" r="13" fill="#CC4141"/>
  <text x="62" y="259" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text>
  <text x="82" y="259" font-size="16" font-weight="700" fill="#333333">Question</text>
  <line x1="172" y1="253" x2="196" y2="253" stroke="#CC4141" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Links that are not on the path -->
  <line x1="298" y1="192" x2="298" y2="154" stroke="#797979" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="298" y1="314" x2="298" y2="352" stroke="#797979" stroke-width="1.5"/>

  <!-- Source docs -->
  <rect x="200" y="96" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="216" y="119" font-size="15" font-weight="700" fill="#555555">Source docs</text>
  <text x="216" y="141" font-size="15" fill="#333333">Emails, contracts, notes</text>

  <!-- Customer node with a structured summary -->
  <rect x="200" y="192" width="196" height="122" rx="12" fill="#FFFFFF" stroke="#CC4141" stroke-width="2.5"/>
  <text x="216" y="216" font-size="15" font-weight="700" fill="#CC4141">Customer</text>
  <text x="216" y="240" font-size="16" font-weight="700" fill="#333333">Alfreds Futterkiste</text>
  <line x1="216" y1="252" x2="380" y2="252" stroke="#E0E0E0" stroke-width="1"/>
  <text x="216" y="276" font-size="15" fill="#333333">Berlin, Germany</text>
  <text x="216" y="298" font-size="15" fill="#333333">Contact: Maria Anders</text>

  <!-- Contact -->
  <rect x="200" y="352" width="196" height="58" rx="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="216" y="375" font-size="15" font-weight="700" fill="#555555">Contact</text>
  <text x="216" y="397" font-size="16" font-weight="700" fill="#333333">Maria Anders</text>

  <!-- Path: Customer -> Orders -> Product -> Supplier -> Country -->
  <path d="M396,214 H420 V118 H440" fill="none" stroke="#CC4141" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="414" y="178" font-size="15" fill="#555555" text-anchor="end">placed</text>

  <g fill="#FFFFFF" stroke="#CC4141" stroke-width="2">
    <rect x="444" y="96" width="114" height="44" rx="10"/>
    <rect x="444" y="168" width="114" height="54" rx="10"/>
    <rect x="444" y="250" width="114" height="44" rx="10"/>
    <rect x="444" y="322" width="114" height="54" rx="10"/>
  </g>
  <g font-size="16" font-weight="700" fill="#333333" text-anchor="middle">
    <text x="501" y="124">Orders</text>
    <text x="501" y="191">Product</text>
    <text x="501" y="278">Supplier</text>
    <text x="501" y="345">Country</text>
  </g>
  <g font-size="15" fill="#CC4141" text-anchor="middle">
    <text x="501" y="211">discontinued</text>
    <text x="501" y="365">Germany</text>
  </g>

  <g stroke="#CC4141" stroke-width="2" marker-end="url(#arrow-red)">
    <line x1="501" y1="140" x2="501" y2="166"/>
    <line x1="501" y1="222" x2="501" y2="248"/>
    <line x1="501" y1="294" x2="501" y2="320"/>
  </g>
  <g font-size="15" fill="#555555" text-anchor="end">
    <text x="493" y="159">contains</text>
    <text x="493" y="241">supplied by</text>
    <text x="493" y="313">located in</text>
  </g>

  <!-- The path and its sources go to the model -->
  <path d="M564,100 H576 V372 H564" fill="none" stroke="#CC4141" stroke-width="2" stroke-linejoin="round"/>
  <line x1="578" y1="253" x2="656" y2="253" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="617" y="224" font-size="15" fill="#555555" text-anchor="middle">path +</text>
  <text x="617" y="242" font-size="15" fill="#555555" text-anchor="middle">sources</text>

  <rect x="660" y="208" width="100" height="90" rx="14" fill="#CC4141"/>
  <text x="710" y="262" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">LLM</text>
</svg>
